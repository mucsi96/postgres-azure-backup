name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-client:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-client-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Run client tests
        working-directory: client
        run: npm test
  build-server-image:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-build-server-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # The Spring profile is resolved during AOT processing and baked into the
      # native executable, so the e2e image is built with the test profile and
      # the published image (see publish-server) with the prod profile.
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          build-args: SPRING_PROFILE=test
          tags: localhost/postgres-azure-backup-server:test
          outputs: type=docker,dest=/tmp/server-image.tar
          cache-from: type=gha,scope=server-test
          cache-to: type=gha,mode=max,scope=server-test
      - name: Upload server image
        uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: /tmp/server-image.tar
          retention-days: 1

  build-client-image:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-build-client-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          tags: localhost/postgres-azure-backup-client:test
          outputs: type=docker,dest=/tmp/client-image.tar
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
      - name: Upload client image
        uses: actions/upload-artifact@v4
        with:
          name: client-image
          path: /tmp/client-image.tar
          retention-days: 1

  test-e2e:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-e2e-${{ github.ref }}
      cancel-in-progress: true
    needs: [test-client, build-server-image, build-client-image]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: test/package-lock.json
      - name: Install dependencies
        working-directory: test
        run: npm ci
      - name: Install Playwright browsers
        working-directory: test
        run: npx playwright install chromium --with-deps
      - name: Download server image
        uses: actions/download-artifact@v4
        with:
          name: server-image
          path: /tmp
      - name: Download client image
        uses: actions/download-artifact@v4
        with:
          name: client-image
          path: /tmp
      - name: Load images into Podman
        run: |
          podman load -i /tmp/server-image.tar
          podman load -i /tmp/client-image.tar
      # The server is a single native executable, so if it cannot even start in
      # the runtime image there is nothing to log and the pod just times out
      # three minutes later with an empty container log. Fail here instead.
      - name: Check the server executable runs
        run: |
          podman run --rm localhost/postgres-azure-backup-server:test \
            -XX:PrintFlags= > /dev/null
      - name: Setup test environment and start pod
        env:
          SKIP_BUILD: "1"
        run: scripts/pod_up.sh
      - name: Run Playwright tests
        working-directory: test
        run: npx playwright test
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test/test-results
      - name: Collect pod logs
        if: always()
        run: |
          for container in $(podman pod inspect postgres-azure-backup-test --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null); do
            echo "$container" | grep -q "infra" && continue
            echo "=== $container ==="
            podman logs "$container" 2>&1 || true
          done

  publish-server:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-publish-server-${{ github.ref }}
      cancel-in-progress: true
    needs: test-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      hasNextVersion: ${{ steps.get_next_version.outputs.hasNextVersion }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get next version
        id: get_next_version
        uses: mucsi96/get-next-version@main
        with:
          prefix: 'server'
          src: server

      - name: Set up Docker Buildx
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          build-args: SPRING_PROFILE=prod
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/postgres-azure-backup-server:${{ steps.get_next_version.outputs.version }}
          cache-from: type=gha,scope=server-prod
          cache-to: type=gha,mode=max,scope=server-prod

      - name: Create release
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_next_version.outputs.tag }}
          generate_release_notes: true

  publish-client:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-publish-client-${{ github.ref }}
      cancel-in-progress: true
    needs: test-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get next version
        id: get_next_version
        uses: mucsi96/get-next-version@main
        with:
          prefix: 'client'
          src: client

      - name: Set up Docker Buildx
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push client image
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/postgres-azure-backup-client:${{ steps.get_next_version.outputs.version }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Create release
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_next_version.outputs.tag }}
          generate_release_notes: true

  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    needs: [publish-server, publish-client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.2.7'

      - name: Connect to Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Deploy to Kubernetes
        env:
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: scripts/deploy.sh
