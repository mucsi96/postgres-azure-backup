name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-test-client-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Run client tests
        working-directory: client
        run: npm test
  build-server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-build-server-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # The Spring profile is resolved during AOT processing and baked into the
      # native executable, so the e2e image is built with the test profile and
      # the published image (see publish-server) with the prod profile.
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          build-args: SPRING_PROFILE=test
          tags: localhost/postgres-azure-backup-server:test
          outputs: type=docker,dest=/tmp/server-image.tar
          cache-from: type=gha,scope=server-test
          cache-to: type=gha,mode=max,scope=server-test
      - name: Upload server image
        uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: /tmp/server-image.tar
          retention-days: 1

  build-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-client-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build static client
        working-directory: client
        run: |
          npm ci
          npm run build
      - name: Upload static client
        uses: actions/upload-artifact@v4
        with:
          name: client-static
          path: client/dist
          retention-days: 1

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-test-e2e-${{ github.ref }}
      cancel-in-progress: true
    needs: [test-client, build-server-image, build-client]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: test/package-lock.json
      - name: Install dependencies
        working-directory: test
        run: npm ci
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/node_modules/playwright-core/package.json') }}
      - name: Install Chromium and Linux dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: test
        run: npx playwright install chromium --with-deps
      - name: Install Linux dependencies for cached Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: test
        run: npx playwright install-deps chromium
      - name: Download server image
        uses: actions/download-artifact@v4
        with:
          name: server-image
          path: /tmp
      - name: Download static client
        uses: actions/download-artifact@v4
        with:
          name: client-static
          path: client/dist
      - name: Check direct static assets and build-time Faro
        run: node test/static-assets.mjs
      - name: Load images into Podman
        run: |
          podman load -i /tmp/server-image.tar
      # The server is a single native executable, so if it cannot even start in
      # the runtime image there is nothing to log and the pod just times out
      # three minutes later with an empty container log. Fail here instead.
      - name: Check the server executable runs
        run: |
          timeout 60 podman run --rm localhost/postgres-azure-backup-server:test \
            -XX:PrintFlags= > /dev/null
      - name: Setup test environment and start pod
        env:
          SKIP_BUILD: "1"
        run: scripts/pod_up.sh
      - name: Run Playwright tests
        working-directory: test
        run: npx playwright test
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test/test-results
      - name: Collect pod logs
        if: always()
        run: |
          for container in $(podman pod inspect postgres-azure-backup-test --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null); do
            echo "$container" | grep -q "infra" && continue
            echo "=== $container ==="
            podman logs "$container" 2>&1 || true
          done

  publish-server:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: ${{ github.workflow }}-publish-server-${{ github.ref }}
      cancel-in-progress: false
    needs: test-e2e
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.get_next_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get next version
        id: get_next_version
        uses: mucsi96/get-next-version@main
        with:
          prefix: 'server'
          src: server

      - name: Set up Docker Buildx
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          build-args: SPRING_PROFILE=prod
          tags: ghcr.io/${{ github.repository }}-server:${{ steps.get_next_version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=server-prod
          cache-to: type=gha,mode=max,scope=server-prod

      # Tag the commit whose versioned image was published, even if main has advanced.
      - name: Create release
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_next_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  publish-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-publish-client-${{ github.ref }}
      cancel-in-progress: false
    needs: test-e2e
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_next_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get next version
        id: get_next_version
        uses: mucsi96/get-next-version@main
        with:
          prefix: 'client'
          src: client

      - name: Download tested static client
        uses: actions/download-artifact@v4
        with:
          name: client-static
          path: /tmp/client-static
      - name: Package client release
        run: tar -czf /tmp/client-static.tar.gz -C /tmp/client-static .

      # Tag the commit this artifact was built from, not whatever main points
      # at by the time the release is created - see publish-server above.
      - name: Create release
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_next_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: /tmp/client-static.tar.gz

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    needs: [publish-server, publish-client]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download tested static client
        uses: actions/download-artifact@v4
        with:
          name: client-static
          path: client-static

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare static client URLs
        id: client
        env:
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          config=$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name client-storage-config --query value -o tsv)
          account=$(jq -er '.account_name' <<< "$config")
          assets_url=$(jq -er '.assets_base_url' <<< "$config")
          hostname=$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name hostname --query value -o tsv)
          node scripts/prepare-client.mjs client-static client-publish "$assets_url" "https://$hostname"
          echo "account=$account" >> "$GITHUB_OUTPUT"
      - name: Publish client assets then document
        uses: azure/cli@v2
        env:
          STORAGE_ACCOUNT: ${{ steps.client.outputs.account }}
        with:
          inlineScript: |
            set -euo pipefail
            az storage blob upload-batch --auth-mode login --account-name "$STORAGE_ACCOUNT" \
              --destination assets --source client-publish/assets --overwrite true \
              --content-cache-control no-cache --only-show-errors --output none
            az storage blob upload --auth-mode login --account-name "$STORAGE_ACCOUNT" \
              --container-name assets --name manifest.webmanifest --file client-publish/assets/manifest.webmanifest \
              --overwrite true --content-type application/manifest+json --content-cache-control no-cache \
              --only-show-errors --output none
            az storage blob upload --auth-mode login --account-name "$STORAGE_ACCOUNT" \
              --container-name '$web' --name index.html --file client-publish/documents/index.html \
              --overwrite true --content-type text/html --content-cache-control no-store \
              --only-show-errors --output none

      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.2.7'

      - name: Connect to Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Deploy to Kubernetes
        env:
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
          SERVER_IMAGE: ghcr.io/${{ github.repository }}-server:${{ needs.publish-server.outputs.version }}
        run: scripts/deploy.sh
