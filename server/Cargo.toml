[package]
name = "postgres-azure-backup-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
azure_identity = "1.0"
azure_security_keyvault_secrets = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
loco-rs = { version = "1.2", default-features = false, features = ["cli"] }
object_store = { version = "0.14", default-features = false, features = ["azure"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
