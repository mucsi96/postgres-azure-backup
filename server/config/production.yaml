logger:
  enable: true
  level: info
  format: json
server:
  binding: <%= get_env(name="BINDING", default="0.0.0.0") %>
  port: <%= get_env(name="PORT", default="8080") %>
  host: http://localhost
  middlewares:
    etag:
      enable: false
    fallback:
      enable: false
    secure_headers:
      enable: true
      preset: empty
      overrides:
        Cache-Control: no-store
        X-Content-Type-Options: nosniff
workers:
  mode: BackgroundAsync
settings:
  oidc:
    issuer: ""
    audience: ""
  storage:
    endpoint: ""
    container: ""
    connection_string: ""
  databases_path: ""
  schedule_enabled: <%= get_env(name="BACKUP_SCHEDULE_ENABLED", default="true") %>
