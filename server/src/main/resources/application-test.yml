databasesConfigPath: ${DATABASES_CONFIG_PATH}
spring:
  cloud:
    azure:
      keyvault:
        secret:
          property-sources: []
      storage:
        blob:
          connection-string: ${BLOBSTORAGE_CONNECTION_STRING}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8166/default/jwks
          audiences: mock-api-client-id

mock-oauth2-server-uri: ${MOCK_OAUTH2_SERVER_URI:}
