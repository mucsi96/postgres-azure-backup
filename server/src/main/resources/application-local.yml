server:
  port: 8168
management:
  server:
    port: 8162

spring:
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - endpoint: ${AZURE_KEYVAULT_ENDPOINT}
              enabled: true
      storage:
        blob:
          endpoint: ${storage-account-blob-url}
          credential:
            client-id: ${api-client-id}
            client-secret: ${api-client-secret}
