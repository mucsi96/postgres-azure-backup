blobstorage:
  baseUrl: ${STORAGE_ACCOUNT_BLOB_URL:}
  containerName: ${STORAGE_ACCOUNT_CONTAINER_NAME}

databasesConfigPath: ${DATABASES_CONFIG_PATH}

backup:
  smart:
    # Enable smart backup on startup and via REST endpoint
    enabled: ${SMART_BACKUP_ENABLED:true}

management:
  server:
    port: ${SPRING_ACTUATOR_PORT}
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
