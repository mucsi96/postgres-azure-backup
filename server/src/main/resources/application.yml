server:
  servlet:
    context-path: /api
spring:
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - endpoint: https://p06-backup.vault.azure.net/
              enabled: true

      active-directory:
        enabled: true
        credential:
          client-id: ${api-client-id}

      storage:
        blob:
          endpoint: ${storage-account-blob-url:}
          credential:
            client-id: ${api-client-id:}

blobstorage:
  containerName: ${storage-account-container-name:}

management:
  server:
    port: ${SPRING_ACTUATOR_PORT}
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
