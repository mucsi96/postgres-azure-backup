server:
  servlet:
    context-path: /api
spring:
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - endpoint: https://p06-backup.vault.azure.net/
              enabled: true

      active-directory:
        enabled: true
        credential:
          client-id: ${api-client-id}

blobstorage:
  clientId: ${api-client-id}
  tenantId: ${tenant-id}
  clientSecret: ${api-client-secret:}
  accountUrl: ${storage-account-blob-url:}
  containerName: ${storage-account-container-name:}

management:
  server:
    port: ${SPRING_ACTUATOR_PORT}
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
