server:
  forward-headers-strategy: framework
  servlet:
    context-path: /api
# The Key Vault property source is configured in the prod and local profiles
# (instead of here) so that it stays inactive during AOT processing for the
# GraalVM native image build, where no profile is active and
# AZURE_KEYVAULT_ENDPOINT is not set.
spring:
  # The Spring Cloud Azure auto-configurations are excluded because the GraalVM
  # native image build fails on them: the Azure jars are signed, and the
  # unsigned Spring AOT-generated classes placed in the same packages trigger
  # "signer information does not match" errors. They are not needed:
  # BlobContainerClient is created in StorageConfiguration, and the Key Vault
  # property source is an environment post-processor, not an auto-configuration.
  autoconfigure:
    exclude:
      - com.azure.spring.cloud.autoconfigure.implementation.context.AzureGlobalPropertiesAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.context.AzureTokenCredentialAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.storage.blob.AzureStorageBlobAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.storage.blob.AzureStorageBlobResourceAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.keyvault.secrets.AzureKeyVaultSecretAutoConfiguration
  cloud:
    azure:
      storage:
        blob:
          container-name: ${storage-account-container-name}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${tenant-id:}/v2.0
          audiences: ${api-client-id:}

# SPRING_ACTUATOR_PORT has no default here so a deployment that forgets to
# set it still fails fast at startup. AOT processing for the GraalVM native
# image build needs the placeholder resolvable, so the Dockerfile build stage
# sets the env var (to a value different from the server port — the
# "management runs on a separate port" condition is fixed at build time).
management:
  server:
    port: ${SPRING_ACTUATOR_PORT}
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
