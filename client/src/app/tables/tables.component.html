@if (tableData.isLoading()) {
<mat-spinner class="page-loading" />
} @else {
<section class="actions">
  <button
    mat-flat-button
    color="primary"
    [disabled]="processing()"
    (click)="createBackup()"
  >
    Backup
  </button>
  <button
    mat-stroked-button
    [disabled]="processing()"
    (click)="exportSql()"
  >
    Export SQL
  </button>
</section>

<section class="stats">
  <div class="stat">
    <span class="label">Records</span>
    <span class="count-badge">{{ totalRowCount() }}</span>
  </div>
  <div class="stat">
    <span class="label">Files</span>
    <span class="count-badge">{{ fileCount() }}</span>
  </div>
</section>

<section class="tables">
  <h2>
    Tables <span class="count-badge">{{ tables()?.length }}</span>
  </h2>
  @if (tables()?.length) {
  <mat-card class="table-card">
    <table mat-table [dataSource]="tables() ?? []" class="data-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let table" class="highlighted">
          {{ table.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="rowCount">
        <th mat-header-cell *matHeaderCellDef class="center">Records</th>
        <td mat-cell *matCellDef="let table" class="center">
          {{ table.rowCount }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card>
  }
</section>
}
