<div class="selected-database">
  @if (databaseName()) {
  <button mat-stroked-button [matMenuTriggerFor]="databaseMenu" class="database-trigger">
    {{ databaseName() }}
    <mat-icon>arrow_drop_down</mat-icon>
  </button>
  <mat-menu #databaseMenu="matMenu">
    @for (database of databases.value(); track database.name) {
    <a mat-menu-item routerLink="/database/{{ database.name }}">{{ database.name }}</a>
    }
  </mat-menu>
  @let time = lastBackupTime.value();
  <div class="last-backup">
    <span class="label">Last backup</span>
    <span
      class="badge"
      [class.green]="time && !olderThenOneDay(time)"
      [class.red]="olderThenOneDay(time)"
      >@if (time) {{{ time | relativeTime }}} @else { — }</span
    >
  </div>
  }
  <button class="avatar" [matMenuTriggerFor]="profileMenu" aria-label="Profile menu">
    {{ profile()?.initials }}
  </button>
  <mat-menu #profileMenu="matMenu">
    <span class="profile-name">
      {{ profile()?.name }}
    </span>
  </mat-menu>
</div>
